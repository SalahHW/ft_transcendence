<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Wallet Auth Test</title>
  </head>
  <body>
    <h1>Wallet Authentication</h1>

    <label>
      Username:
      <input type="text" id="username" placeholder="Enter username" />
    </label>
    <br /><br />

    <button id="register">Register Wallet</button>
    <button id="login">Login Wallet</button>

    <pre id="output"></pre>

    <script>
      const API_BASE = "https://elsalmajori.games:8443";

      async function getChallenge(wallet) {
        const res = await fetch(
          `${API_BASE}/wallet/challenge?wallet=${wallet}`
        );
        if (!res.ok) throw new Error("Failed to get challenge");
        return await res.json();
      }

      async function signMessage(message, wallet) {
        return await window.ethereum.request({
          method: "personal_sign",
          params: [message, wallet],
        });
      }

      async function registerWithWallet() {
        const username = document.getElementById("username").value.trim();
        const output = document.getElementById("output");
        output.innerText = "";

        if (!username) return alert("Enter a username.");
        if (!window.ethereum) return alert("MetaMask not detected.");

        try {
          const [wallet] = await window.ethereum.request({
            method: "eth_requestAccounts",
          });

          const { challenge, timestamp } = await getChallenge(wallet);
          const signature = await signMessage(challenge, wallet);

          const res = await fetch(`${API_BASE}/register/wallet`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ wallet, username, signature, timestamp }),
          });

          const data = await res.json();
          output.innerText = JSON.stringify(data, null, 2);
        } catch (err) {
          output.innerText = `Error: ${err.message}`;
        }
      }

      async function loginWithWallet() {
        const output = document.getElementById("output");
        output.innerText = "";

        if (!window.ethereum) return alert("MetaMask not detected.");

        try {
          const [wallet] = await window.ethereum.request({
            method: "eth_requestAccounts",
          });

          const { challenge, timestamp } = await getChallenge(wallet);
          const signature = await signMessage(challenge, wallet);

          const res = await fetch(`${API_BASE}/login/wallet`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ wallet, signature, timestamp }),
          });

          const data = await res.json();
          output.innerText = JSON.stringify(data, null, 2);
        } catch (err) {
          output.innerText = `Error: ${err.message}`;
        }
      }

      document
        .getElementById("register")
        .addEventListener("click", registerWithWallet);
      document
        .getElementById("login")
        .addEventListener("click", loginWithWallet);
    </script>
  </body>
</html>
