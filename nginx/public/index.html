<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Register With Wallet</title>
  </head>
  <body>
    <h1>Register With Wallet</h1>

    <label>
      Username:
      <input type="text" id="username" placeholder="Enter username" />
    </label>
    <br /><br />

    <button id="register">Register Wallet</button>

    <pre id="output"></pre>

    <script>
      const API_BASE = "https://elsalmajori.games:8443"; // change if needed

      async function registerWithWallet() {
        const username = document.getElementById("username").value.trim();
        const output = document.getElementById("output");
        output.innerText = "";

        if (!username) {
          return alert("Enter a username.");
        }

        if (!window.ethereum) {
          return alert("MetaMask not detected.");
        }

        try {
          const [wallet] = await window.ethereum.request({
            method: "eth_requestAccounts",
          });

          // Step 1: Get challenge with timestamp
          const challengeRes = await fetch(
            `${API_BASE}/wallet/challenge?wallet=${wallet}`
          );
          const { challenge, timestamp } = await challengeRes.json();

          // Step 2: Sign the challenge
          const signature = await window.ethereum.request({
            method: "personal_sign",
            params: [challenge, wallet],
          });

          // Step 3: Register using the signed challenge
          const registerRes = await fetch(`${API_BASE}/register/wallet`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ wallet, username, signature, timestamp }), // ✅ timestamp added
          });

          const result = await registerRes.json();
          output.innerText = JSON.stringify(result, null, 2);
        } catch (err) {
          output.innerText = `Error: ${err.message}`;
        }
      }

      document
        .getElementById("register")
        .addEventListener("click", registerWithWallet);
    </script>
  </body>
</html>
