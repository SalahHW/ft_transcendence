<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>BABY_PONG V.2</title>
    <style>
      #gameControls {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        text-align: center;
      }
      #joinGameBtn {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
      }
      #joinGameBtn:disabled {
        background-color: #cccccc;
        cursor: not-allowed;
      }
      #gameStatus {
        color: white;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div id="gameControls">
      <button id="joinGameBtn">Join Game</button>
      <div id="gameStatus"></div>
    </div>
    <canvas id="renderCanvas"></canvas>
    <script type="module" src="src/client/client.js"></script>
  </body>
</html>
