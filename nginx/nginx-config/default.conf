server {
	  listen 443 ssl;
    server_name elsalmajori.games;

    ssl_certificate           /etc/ssl/elsalmajori/cert.pem;
    ssl_certificate_key       /etc/ssl/elsalmajori/key.pem;
    ssl_trusted_certificate   /etc/ssl/elsalmajori/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

	location / {
		root /app/public/;
		index index.html;
	}

	location /node_modules/ {
		root /app/;
		expires 1d;
		add_header Cache-Control "public, immutable";
	}

	location /users {
		proxy_pass http://users:3000/users;
	}

	location /register {
		proxy_pass http://users:3000/register;
	}

	location /login {
		proxy_pass http://users:3000/login;
	}

	location /logout {
		proxy_pass http://users:3000/logout;
	}

	location /me {
		proxy_pass http://users:3000/me;
	}

	location /avatars {
		proxy_pass http://avatars:3000/avatars;
	}

	location /friends {
		proxy_pass http://friends:3003/friends;
	}

	# Game service WebSocket endpoint
	location /api/game/ws {
		proxy_pass http://game:8081/ws;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_cache_bypass $http_upgrade;
	}

	# Game service API endpoints
	location /api/game/ {
		proxy_pass http://game:8081/api/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Static game assets (sounds)
	location /sounds/ {
		proxy_pass http://game:8081/sounds/;
		expires 1d;
		add_header Cache-Control "public, immutable";
	}
}
