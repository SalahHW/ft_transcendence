server {
    listen 443 ssl;
    server_name elsalmatjori.com;

    ssl_certificate           /etc/ssl/elsalmatjori/fullchain.pem;
    ssl_certificate_key       /etc/ssl/elsalmatjori/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_connect_timeout       60s;
    proxy_send_timeout          60s;
    proxy_read_timeout          60s;
    send_timeout                60s;

	location / {
		root /app/public/;
		index index.html;
	}

	location /node_modules/ {
		root /app/;
		expires 1d;
		add_header Cache-Control "public, immutable";
	}

    # === USER SERVICE ROUTES ===
    location /users {
        proxy_pass http://users:3000;
    }

    location /register {
        proxy_pass http://users:3000;
    }


	location /logout {
		proxy_pass http://users:3000;
	}
    location /login {
        proxy_pass http://users:3000;
    }

    location /register/wallet {
        proxy_pass http://users:3000;
    }

    location /login/wallet {
        proxy_pass http://users:3000;
    }

	location /avatars {
		proxy_pass http://avatars:3001/avatars;
	}

	location /friends {
		proxy_pass http://friends:3003/friends;
	}

	# Game service WebSocket endpoint
	location /api/game/ws {
		proxy_pass http://game:8081/ws;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_cache_bypass $http_upgrade;
	}

	# Game service API endpoints
	location /api/game/ {
		proxy_pass http://game:8081/api/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Static game assets (sounds)
	location /sounds/ {
		proxy_pass http://game:8081/sounds/;
		expires 1d;
		add_header Cache-Control "public, immutable";
	}
    location /me {
        proxy_pass http://users:3000;
    }

    location /wallet/challenge {
        proxy_pass http://users:3000;
    }

    location /wallet/verify {
        proxy_pass http://users:3000;
    }
    # === BLOCKCHAIN SERVICE ROUTES ===
    location /add-player {
        proxy_pass http://blockchain:3001;
    }

    location /remove {
        proxy_pass http://blockchain:3001;
    }

    location /report-match {
        proxy_pass http://blockchain:3001;
    }

    location /report-tournament {
        proxy_pass http://blockchain:3001;
    }

    location /player/ {
        proxy_pass http://blockchain:3001;
    }

    location /match/ {
        proxy_pass http://blockchain:3001;
    }

    location /tournament/ {
        proxy_pass http://blockchain:3001;
    }

    location /nft/goat/ {
        proxy_pass http://blockchain:3001;
    }

    location /nft/tournament/ {
        proxy_pass http://blockchain:3001;
    }

    location /match/player/{
        proxy_pass http://blockchain:3001;
    }

    location /match/winner/{
        proxy_pass http://blockchain:3001;
    }

    location /refresh {
      proxy_pass http://jwt:3005;
    }

}
