server {
	listen 80 default_server;

	location / {
		root /app/public/;
		index index.html;
	}

	location /node_modules/ {
		root /app/;
		expires 1d;
		add_header Cache-Control "public, immutable";
	}

	location /users {
		proxy_pass http://users:3000/users;
	}

	location /register {
		proxy_pass http://users:3000/register;
	}

	location /login {
		proxy_pass http://users:3000/login;
	}

	location /me {
		proxy_pass http://users:3000/me;
	}
}
