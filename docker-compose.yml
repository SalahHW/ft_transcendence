# TODO: create a shared image used by all containers
services:
  nginx:
    container_name: nginx
    build: ./nginx/
    ports:
      - "80:80"
    networks:
      - users
      - transcendence

  users:
    container_name: users
    build: ./users-service
    env_file:
      - ./.env
      - ./users-service/.env
    networks:
      - users
      - blockchain
      - transcendence
    volumes:
      - ./database:/app/database

  jwt:
    container_name: jwt
    build: ./jwt-service
    env_file:
      - ./.env
      - ./jwt-service/.env
    networks:
      - transcendence

  blockchain:
    container_name: blockchain
    build: ./blockchain-service
    env_file:
      - ./.env
      - ./blockchain-service/.env
    networks:
      - blockchain

networks:
  users:
  blockchain:
  transcendence:
