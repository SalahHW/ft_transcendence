services:
  nginx:
    container_name: nginx
    build: ./nginx/
    ports:
      - "16443:443"
    networks:
      - transcendence
    restart: on-failure

  redis:
    container_name: redis
    build: ./redis-service
    env_file:
      - ./redis-service/.env
    networks:
      - transcendence
    volumes:
      - redis-data:/data
    restart: on-failure

  users:
    container_name: users
    build: ./users-service
    env_file:
      - ./.env
      - ./users-service/.env
    networks:
      - transcendence
    volumes:
      - users-db:/app/database
    restart: on-failure

  jwt:
    container_name: jwt
    build: ./jwt-service
    env_file:
      - ./.env
      - ./jwt-service/.env
    networks:
      - transcendence
    restart: on-failure

  blockchain:
    container_name: blockchain
    build: ./blockchain-service
    env_file:
      - ./.env
      - ./blockchain-service/.env
    networks:
      - transcendence
    restart: on-failure

  game:
    container_name: game
    build: ./game-service
    env_file:
      - ./.env
      - ./game-service/.env
    networks:
      - transcendence
    restart: on-failure

  avatars:
    container_name: avatars
    build: ./avatars-service
    env_file:
      - ./.env
      - ./avatars-service/.env
    networks:
      - transcendence
    volumes:
      - avatars-db:/app/database
      - avatars-store:/app/avatars
    restart: on-failure

  friends:
    container_name: friends
    build: ./friends-service
    env_file:
      - ./.env
    networks:
      - transcendence
    volumes:
      - friends-db:/app/database
    restart: on-failure

  presences:
    container_name: presences
    build: ./presences-service
    env_file:
      - ./.env
    networks:
      - transcendence
    restart: on-failure

networks:
  transcendence:

volumes:
  redis-data:
  users-db:
  avatars-db:
  avatars-store:
  friends-db:
